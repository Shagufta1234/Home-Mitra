<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Mitra - Beyond Handmade, It's Homegrown Passion</title>
    <link rel="icon" type="image/png" href="images/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <div class="glass-container">
            <header class="header">
                <nav class="navbar">
                    <button class="menu-toggle" aria-label="Toggle menu">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                    <ul class="nav-links">
                        <li><a href="#about">About Us</a></li>
                        <li><a href="#story">Story</a></li>
                        <li><a href="#bts">BTS</a></li>
                        <li><a href="#contact">Contact Us</a></li>
                    </ul>
                    <div class="search-container">
                        <input type="text" class="search-input" placeholder="Search..">
                        <button class="search-btn" aria-label="Search">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"/>
                                <path d="m21 21-4.35-4.35"/>
                            </svg>
                        </button>
                    </div>
                </nav>
            </header>
            <section class="hero">
                <div class="hero-content">
                    <h1 class="hero-title">
                        <span>Beyond Handmade,&nbsp;It's</span>
                        <span>Homegrown Passion</span>
                    </h1>
                    <p class="hero-subtitle">Handmade for Now, Memories for Ahead.</p>
                </div>
            </section>

            <section class="products">
                <div class="products-grid">
                    <article class="product-card" data-category="shabby-chic">
                        <div class="product-image">
                            <img src="images/Shabby_chic.jpg" alt="Shabby Chic artwork">
                        </div>
                        <div class="product-info">
                            <div class="product-copy">
                                <h2>Shabby<br>Chic</h2>
                            </div>
                            <div class="product-cta">
                                <a href="#shabby-chic" class="product-link" aria-label="View Shabby Chic collection">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polyline points="9 18 15 12 9 6"/>
                                    </svg>
                                </a>
                            </div>
                        </div>
                    </article>

                    <article class="product-card" data-category="resin-art">
                        <div class="product-image">
                            <img src="images/Resin_art.jpg" alt="Resin Art">
                        </div>
                        <div class="product-info">
                            <div class="product-copy">
                                <h2>Resin<br>Art</h2>
                            </div>
                            <div class="product-cta">
                                <a href="#resin-art" class="product-link" aria-label="View Resin Art collection">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polyline points="9 18 15 12 9 6"/>
                                    </svg>
                                </a>
                            </div>
                        </div>
                    </article>

                    <article class="product-card" data-category="lippan-art">
                        <div class="product-image">
                            <img src="images/Lippan_art.jpg" alt="Lippan Art">
                        </div>
                        <div class="product-info">
                            <div class="product-copy">
                                <h2>Lippan<br>Art</h2>
                            </div>
                            <div class="product-cta">
                                <a href="#lippan-art" class="product-link" aria-label="View Lippan Art collection">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polyline points="9 18 15 12 9 6"/>
                                    </svg>
                                </a>
                            </div>
                        </div>
                    </article>
                </div>

                <button class="view-more-btn">
                    View More
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"/>
                    </svg>
                </button>
            </section>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
