<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Coming Soon — Home Mitra</title>
    <link rel="icon" type="image/png" href="images/favicon.ico">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:wght@600&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg-1: #f6efe8;
            --accent: #b55d4c;
            --muted: #7c6f66;
            --card: #ffffff;
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            height: 100%;
            margin: 0;
            font-family: Inter, system-ui, 'Segoe UI', Roboto, Helvetica, Arial;
            color: #222
        }

        body {
            display: grid;
            place-items: center;
            background: radial-gradient(1200px 600px at 10% 20%, rgba(181, 93, 76, 0.06), transparent 15%),
                radial-gradient(900px 500px at 90% 80%, rgba(229, 190, 176, 0.04), transparent 15%),
                linear-gradient(180deg, var(--bg-1), #fff 60%);
            min-height: 100vh;
            padding: 28px;
        }

        .card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 700px;
            border-radius: 18px;
            padding: 48px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.88));
            box-shadow: 0 20px 50px rgba(21, 20, 19, 0.12);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), #e7b9ad);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(181, 93, 76, 0.18);
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }

        .site-name {
            font-family: "Playfair Display", serif;
            font-size: 20px;
            color: #2d1f1a;
            font-weight: 700;
        }

        h1 {
            margin: 6px 0 12px;
            font-family: "Playfair Display", serif;
            font-size: 44px;
            line-height: 1.1;
            color: #2f2a29;
        }

        p.lead {
            margin: 0 0 20px;
            color: var(--muted);
            font-size: 16px;
            max-width: 58ch;
        }

        .note {
            margin-top: 10px;
            font-size: 14px;
            color: var(--muted);
        }

        .social {
            display: flex;
            gap: 12px;
            justify-content: flex-start;
            margin-top: 10px;
        }

        .social a {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: #fff;
            display: grid;
            place-items: center;
            text-decoration: none;
            color: #2b2b2b;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
        }

        @media (max-width:600px) {
            .card {
                padding: 30px 20px;
            }

            h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <main class="card">
        <section>
            <div class="brand">
                <!-- replace the src below with your actual logo path -->
                <div class="logo">
                    <img src="images/logo.jpg" alt="Home Mitra Logo" />
                </div>
                <div>
                    <div class="site-name">Home Mitra</div>
                    <div style="font-size:13px;color:var(--muted)">Handmade • Crafted with care</div>
                </div>
            </div>

            <h1>We're crafting something beautiful — coming soon</h1>
            <p class="lead">We're building a curated collection of handmade treasures.</p>

            <div class="note">Follow Home Mitra on Instagram and YouTube for our latest creations.</div>
            <div class="social">
                <a href="https://www.instagram.com/home_mitra?igsh=OGVlNzlpdnpwcTgy" title="Instagram" aria-label="Instagram">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                        <rect x="2.5" y="2.5" width="19" height="19" rx="5" stroke="#4b3b36" stroke-width="1.2" />
                        <path d="M16.5 7.5h.01" stroke="#4b3b36" stroke-width="1.4" stroke-linecap="round" />
                        <path d="M15 12.2a3 3 0 1 1-6 0 3 3 0 0 1 6 0z" stroke="#4b3b36" stroke-width="1.2"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </a>

                <a href="https://youtube.com/@home_mitra?si=1oGCM_lJchJNi71o" title="YouTube" aria-label="YouTube">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
    <rect x="2" y="4" width="20" height="16" rx="3" stroke="#4b3b36" stroke-width="1.2"/>
    <polygon points="10,9 16,12 10,15" stroke="#4b3b36" stroke-width="1.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>
</a>


            </div>
        </section>
    </main>

</body>

</html>
